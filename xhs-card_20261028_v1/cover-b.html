<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>B · 米白编辑感</title>
<style>
  :root{
    --w:1242px; --h:1660px;
    --bg:#F1EDE4;
    --ink:#14130F;
    --dim:rgba(20,19,15,.56);
    --line:rgba(20,19,15,.22);
    --accent:#8C3A1E;
    --serif:"思源宋体 CN","Source Han Serif CN",serif;
    --latin:"EB Garamond",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--bg)}
  .stage{position:relative;display:flex;flex-direction:column;
    width:var(--w);height:var(--h);padding:74px 88px 168px;background:var(--bg)}
  .stage::after{content:"";position:absolute;inset:0;opacity:.12;pointer-events:none;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}

  header .row{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--latin);font-size:19px;letter-spacing:.30em;
    color:var(--dim);text-transform:uppercase}
  header .row b{font-weight:600;color:var(--ink);letter-spacing:.26em}
  header .hr{height:1px;background:var(--line);margin-top:16px}

  .plate{position:relative;height:700px;flex:none;margin-top:34px;overflow:hidden;background:#DCD6C9}
  .plate img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;
    filter:brightness(.92) contrast(1.08) saturate(.5) grayscale(.5)}
  .plate::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(241,237,228,.14) 0%, rgba(241,237,228,0) 28%,
      rgba(20,19,15,.12) 100%)}

  .cap{display:flex;justify-content:space-between;margin-top:18px;flex:none;
    font-family:var(--latin);font-size:17px;letter-spacing:.20em;color:rgba(20,19,15,.48)}

  main{margin-top:46px;flex:none}
  h1{font-family:var(--serif);font-weight:600;font-size:146px;line-height:1;
    letter-spacing:.12em;color:var(--ink)}
  .by{display:flex;align-items:center;gap:24px;margin-top:24px}
  .by i{display:block;width:88px;height:1px;background:var(--accent)}
  .by span{font-family:var(--latin);font-size:28px;letter-spacing:.26em;color:var(--dim)}
  .q{margin-top:30px;font-family:var(--serif);font-size:29px;line-height:1.9;
    letter-spacing:.06em;color:rgba(20,19,15,.74)}

  footer{display:flex;justify-content:space-between;align-items:baseline;
    margin-top:auto;padding-top:22px;border-top:1px solid var(--line);
    font-family:var(--latin);font-size:17px;letter-spacing:.30em;
    color:rgba(20,19,15,.42);text-transform:uppercase}
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="row"><span><b>NO.038</b> — 2026</span><span>Photo · Abstract · Editorial</span></div>
    <div class="hr"></div>
  </header>

  <div class="plate"><img src="./photo.png" alt=""></div>
  <div class="cap"><span>Fig. 01 — 失焦 · 無主體</span><span>35mm · f/1.4</span></div>

  <main>
    <h1>應該</h1>
    <div class="by"><i></i><span>Naiwen Yang</span></div>
    <p class="q">瞳孔的留白穿堂而過，<br>明明有一片綠芽就可以。</p>
  </main>

  <footer><span>一首歌 · 一張卡</span><span>01 / 06</span></footer>
</div>
</body>
</html>
