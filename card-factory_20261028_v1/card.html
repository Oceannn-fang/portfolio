<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>card</title>
<style>
  :root{
    --ink:#e8e4dd;
    --font-title:"思源宋体 CN", "Source Han Serif CN", serif;
    --font-lyric:"汇文明朝体", "源古宋體", "思源宋体 CN", serif;
    --font-latin:"EB Garamond", serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#050507}
  .stage{position:relative;width:1080px;height:1920px;overflow:hidden;isolation:isolate}

  /* 背景：100% 由代码生成，不用任何照片 */
  .bg{position:absolute;inset:0;background:
    radial-gradient(900px 720px at 24% 18%, #141d33 0%, rgba(10,13,24,0) 62%),
    radial-gradient(820px 680px at 82% 74%, #241427 0%, rgba(18,10,20,0) 66%),
    radial-gradient(760px 640px at 16% 88%, #3a1119 0%, rgba(40,12,18,0) 62%),
    linear-gradient(180deg,#07070b 0%, #050508 100%);}
  .bokeh{position:absolute;inset:0}
  .bokeh i{position:absolute;display:block;border-radius:50%}

  .grain{position:absolute;inset:-10%;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>");}
  .vignette{position:absolute;inset:0;
    background:radial-gradient(ellipse 74% 58% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,.42) 76%, rgba(0,0,0,.78) 100%);}

  /* 卡片：真毛玻璃，不是贴图 */
  .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:614px;padding:40px 42px 46px;border-radius:34px;
    background:linear-gradient(180deg, rgba(16,16,20,.60), rgba(8,8,11,.50));
    backdrop-filter:blur(30px) saturate(118%);
    -webkit-backdrop-filter:blur(30px) saturate(118%);
    border:1px solid rgba(255,255,255,.075);
    box-shadow:0 50px 110px -40px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.10);}

  .head{display:flex;align-items:flex-start;gap:24px;margin-bottom:36px}
  .cover{width:106px;height:134px;border-radius:9px;object-fit:cover;flex:none;
    box-shadow:0 10px 26px rgba(0,0,0,.5)}
  .meta{padding-top:10px;display:flex;flex-direction:column;gap:12px}
  .title{font-family:var(--font-title);font-weight:600;font-size:35px;
    letter-spacing:.07em;color:var(--ink)}
  .artist{font-family:var(--font-latin);font-size:21px;
    letter-spacing:.12em;color:rgba(232,228,221,.66)}

  .lyrics{font-family:var(--font-lyric);font-size:31px;line-height:1.86;
    letter-spacing:.045em;color:var(--ink)}
  .lyrics p{white-space:nowrap}

  .serial{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);
    font-family:var(--font-latin);font-size:18px;letter-spacing:.52em;
    color:rgba(255,255,255,.26);text-indent:.52em}
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div class="bokeh" id="bokeh"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="card">
    <div class="head">
      <img class="cover" src="./cover.png" alt="">
      <div class="meta">
        <div class="title">應該</div>
        <div class="artist">Naiwen Yang</div>
      </div>
    </div>
    <div class="lyrics">
      <p>瞳孔的留白穿堂而過</p>
      <p>給刺骨的遐想充作燃料</p>
      <p>澆滅所有誤解與解釋中必要的誠實</p>
      <p>在這裏，</p>
      <p>充斥慶幸的海岬</p>
      <p>倒懸的鐘乳石系上綾羅</p>
      <p>the sobering light和對折的欲言又止</p>
      <p>所以</p>
      <p>明明有一片綠芽就可以</p>
    </div>
  </div>

  <div class="serial">NO.038</div>
</div>

<script>
  /* 确定性伪随机：同一个 seed 永远出同一张背景；换个 seed 就是一张全新的 */
  let s = 20261028;
  const rnd = () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
  const layer = document.getElementById('bokeh');
  const hues = [212, 246, 268, 340, 8, 196];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('i');
    const size = 26 + rnd() * 210;
    const x = rnd() * 1080 - 60;
    const y = rnd() * 1920 - 60;
    const hue = hues[Math.floor(rnd() * hues.length)];
    const sat = 26 + rnd() * 40;
    const lig = 46 + rnd() * 26;
    const a = 0.08 + rnd() * 0.42;
    const blur = 5 + rnd() * 22;
    el.style.cssText =
      'left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size + 'px;' +
      'background:radial-gradient(circle at 36% 32%, hsla(' + hue + ',' + sat + '%,' + (lig + 20) + '%,' + a + ') 0%,' +
      'hsla(' + hue + ',' + sat + '%,' + lig + '%,' + (a * 0.8) + ') 56%,' +
      'hsla(' + hue + ',' + sat + '%,' + (lig - 20) + '%,0) 71%);' +
      'filter:blur(' + blur + 'px);';
    if (rnd() < 0.3) {
      el.style.boxShadow =
        '0 0 0 ' + (1 + rnd() * 2.5) + 'px hsla(' + hue + ',55%,72%,' + (0.10 + rnd() * 0.16) + '),' +
        '0 0 ' + (24 + rnd() * 44) + 'px hsla(348,78%,54%,' + (0.12 + rnd() * 0.16) + ')';
    }
    layer.appendChild(el);
  }
</script>
</body>
</html>
